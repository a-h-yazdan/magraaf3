${x?`<label>${x[0]}</label><select name="x"><option value="">همه</option>${x[1].map(o=>`<option ${g('x')==o?'selected':''}>${o}</option>`).join('')}</select>`:''}

<button class="btn" style="width:100%;margin-top:10px">اعمال</button></form>

function runSearch(q){const g=k=>q.get(k)||'';let r=P.filter(p=>{const t=g('t');
if(t&&!(p[1]+CATS[p[2]][p[3]+1]+CATS[p[2]][0]+CITY[p[4]]+p[12]).includes(t.trim()))return 0;
if(g('cat')!==''&&p[2]!=g('cat'))return 0;if(g('sub')!==''&&p[3]!=g('sub'))return 0;if(g('city')!==''&&p[4]!=g('city'))return 0;if(g('coop')!==''&&p[6]!=g('coop'))return 0;
if(g('fee')&&(!can()||(p[7]&&p[7]>g('fee')*1e6)))return 0;if(g('rate')&&p[8]<g('rate'))return 0;if(g('exp')&&p[5]<g('exp'))return 0;if(g('x')&&p[11]!=g('x'))return 0;if(g('ver')&&!p[9])return 0;if(g('av')&&!p[10])return 0;return 1});
$('#res').innerHTML=`<div class="row sp mu" style="margin-bottom:8px"><span>${fa(r.length)} متخصص یافت شد</span>${S.cmp.length?'<a class="btn s" href="#/favs">مقایسه ('+fa(S.cmp.length)+')</a>':''}</div>`+(r.length?`<div class="g">${r.map(card).join('')}</div>`:'<div class="c">نتیجه‌ای پیدا نشد. فیلترها را کم کنید یا دسته را عوض کنید.</div>')+(g('fee')&&!can()?'<p class="mu">فیلتر دستمزد فقط برای کاربران واردشده کار می‌کند.</p>':'')}
R['/pro/']=id=>{const p=P.find(x=>x[0]==id);if(!p)return R['/404']();const f=S.fav.includes(p[0]);
return `<div class="c" style="margin-top:24px"><div class="row wr"><div class="av" style="width:72px;height:72px;font-size:28px">${ini(p[1])}</div><div><h1 style="margin:0;font-size:26px">${p[1]}</h1><div class="mu">${CATS[p[2]][p[3]+1]} · ${CITY[p[4]]} · ${fa(p[5])} سال سابقه</div></div></div>
<p>${p[12]}</p><div><span class="tg ${p[9]?'v':''}">${p[9]?'هویت تأییدشده':'هویت تأییدنشده'}</span><span class="tg">★ ${fa(p[8])} (نظرات نمونه)</span><span class="tg">${COOP[p[6]]}</span>${p[11]?`<span class="tg">${p[11]}</span>`:''}</div>
<p><b>دستمزد:</b> ${fee(p)}</p><div class="row wr"><button class="btn" data-msg="${p[0]}">ارسال پیام</button><button class="btn o" data-fav="${p[0]}">${f?'♥ ذخیره‌شده':'♡ ذخیره'}</button><button class="btn o" data-cmp="${p[0]}">افزودن به مقایسه</button></div></div>
<section><h2>نمونه‌کار (نمونه)</h2><div class="g"><div class="c"><b>فیلم کوتاه «نمونه ۱»</b><div class="mu">نقش: ${CATS[p[2]][p[3]+1]} · ۱۴۰۳</div></div><div class="c"><b>تیزر «نمونه ۲»</b><div class="mu">نقش: ${CATS[p[2]][p[3]+1]} · ۱۴۰۲</div></div></div></section>`};
R['/projects']=()=>`<div class="row sp wr" style="margin-top:24px"><h2 style="margin:0">پروژه‌ها</h2><a class="btn" href="#/new">ثبت پروژه</a></div><div class="g" style="margin-top:14px">${allPr().filter(j=>j[8]!=='draft').map(pcard).join('')}</div>`;

function propRow(x){const o=allPr().find(j=>j[0]==x.pid);return `<div class="c" style="margin-bottom:8px"><div class="row sp wr"><div><b>${esc(x.by)}</b> — ${esc(x.role)}<div class="mu">${o?o[1]:''} · ${tm(x.fee)} · ${esc(x.msg)}</div></div><div class="row"><span class="tg p">${x.st}</span>${x.mine?`<button class="btn o s" data-pw="${x.id}">پس‌گرفتن</button>`:`<select data-ps="${x.id}" aria-label="وضعیت">${['مشاهده‌شده','در حال مذاکره','پذیرفته‌شده','ردشده'].map(s=>`<option ${s==x.st?'selected':''}>${s}</option>`).join('')}</select>`}</div></div></div>`}
R['/new']=()=>{if(!can())return gate();const d=NEWP;
const sT=['اطلاعات پایه','عوامل موردنیاز','شرایط همکاری','بررسی و انتشار'];
let b='';if(d.s==0)b=`<label for="a1">عنوان پروژه</label><input id="a1" value="${esc(d.t)}"><div class="er" id="e1"></div><label>نوع اثر</label><select id="a2">${PT.map((x,i)=>`<option value="${i}" ${d.ty==i?'selected':''}>${x}</option>`).join('')}</select><label>شهر</label><select id="a3">${CITY.map((x,i)=>`<option value="${i}" ${d.c==i?'selected':''}>${x}</option>`).join('')}</select><label>توضیحات</label><textarea id="a4">${esc(d.ds)}</textarea>`;

if(d.s==3)b=`<table><tr><td>عنوان</td><td>${esc(d.t)}</td></tr><tr><td>نوع</td><td>${PT[d.ty]}</td></tr><tr><td>شهر</td><td>${CITY[d.c]}</td></tr><tr><td>نقش‌ها</td><td>${d.r.map(r=>r[1]).join('، ')}</td></tr><tr><td>همکاری</td><td>${d.co} · ${d.f?tm(d.f):'توافقی'}</td></tr></table>`;
return `<div class="c" style="margin-top:24px;max-width:640px"><h2>ثبت پروژه — مرحله ${fa(d.s+1)} از ۴: ${sT[d.s]}</h2><div class="bar"><i style="width:${(d.s+1)*25}%"></i></div>${b}<div class="row" style="margin-top:16px">${d.s?'<button class="btn o" id="pv">قبلی</button>':''}${d.s<3?'<button class="btn" id="nx">بعدی</button>':'<button class="btn o" id="dr">ذخیره پیش‌نویس</button><button class="btn" id="pb">انتشار آزمایشی</button>'}</div></div>`};

${L.s==0?`<label for="ph">شماره موبایل</label><input id="ph" class="ltr" inputmode="numeric" placeholder="09123456789" value="${L.p}"><div class="er" id="e1"></div><button class="btn" id="l1" style="margin-top:12px">دریافت کد</button><p class="mu">برای ورود به پنل مدیریت آزمایشی، شماره ۰۹۰۰۰۰۰۰۰۰۰ را وارد کنید.</p>`:''}
${L.s==1?`<p class="mu">کد آزمایشی: <b>۱۲۳۴۵</b></p><label for="cd">کد تأیید</label><input id="cd" class="ltr" inputmode="numeric"><div class="er" id="e1"></div><button class="btn" id="l2" style="margin-top:12px">تأیید</button>`:''}
${L.s==2?`<label for="nm">نام نمایشی</label><input id="nm"><div class="er" id="e1"></div><label>نقش‌ها (می‌توانید هر دو را انتخاب کنید)</label><label style="display:flex;gap:8px"><input type="checkbox" id="r1" checked> سفارش‌دهنده پروژه</label><label style="display:flex;gap:8px"><input type="checkbox" id="r2"> متخصص / ارائه‌دهنده خدمات</label><button class="btn" id="l3" style="margin-top:12px">ورود به محیط آزمایشی</button>`:''}
<hr style="border:0;border-top:1px solid var(--ln);margin:16px 0"><a href="#/" class="mu">ادامه به‌عنوان مهمان</a></div>`};

return `<div class="lay" style="margin-top:24px"><div class="c" style="align-self:start"><b>تکمیل پروفایل: ${fa(pc)}٪</b><div class="bar" role="progressbar" aria-valuenow="${pc}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pc}%"></i></div>
<p class="mu">${miss.length?'موارد ناقص:':'همه موارد تکمیل است.'}</p>${miss.map(k=>`<div><a href="#/profile" data-go="p_${k}"><u>${WT[k][1]}</u></a> <span class="mu">(${fa(WT[k][0])}٪)</span></div>`).join('')}
<hr style="border:0;border-top:1px solid var(--ln)"><span class="tg">تکمیل پروفایل</span><span class="tg">هویت تأییدنشده</span><span class="tg">سوابق تأییدنشده</span><button class="btn o s" id="vr" style="margin-top:8px">درخواست تأیید (شبیه‌سازی)</button></div>
<form class="c" id="pf2"><h2>ویرایش پروفایل</h2>${F('name','نام نمایشی')}${F('bio','معرفی حرفه‌ای','ta')}${F('spec','تخصص‌ها (با ویرگول جدا کنید)')}${F('hist','سوابق کاری','ta')}${F('skills','مهارت‌ها')}${F('port','عنوان یک نمونه‌کار')}${F('coop','شرایط همکاری','sel')}${F('fee','دستمزد روزانه (تومان)','n')}${F('city','شهر فعالیت','sel')}<label style="display:flex;gap:8px"><input type="checkbox" id="p_photo" ${p.photo?'checked':''}> تصویر بارگذاری شد (نمایشی)</label><button class="btn" style="margin-top:14px">ذخیره</button></form></div>`};

let CH=0;

R['/notifs']=()=>{if(!can())return gate();return `<div class="row sp" style="margin-top:24px"><h2 style="margin:0">اعلان‌ها</h2><button class="btn o s" id="ra">همه را خوانده‌شده کن</button></div>${S.nt.map((n,i)=>`<div class="c" style="margin:8px 0;${n.r?'opacity:.6':''}"><div class="row sp"><span>${n.r?'':'● '}${n.t}</span>${n.r?'':`<button class="btn o s" data-rd="${i}">خوانده شد</button>`}</div></div>`).join('')}<p class="mu">اعلان پیامکی شبیه‌سازی‌شده است.</p>`};
R['/settings']=()=>R['/profile']();
R['/admin']=()=>{if(!(S.user&&S.user.admin))return `<div class="c" style="margin-top:24px"><h2>دسترسی ندارید</h2><p>این بخش فقط برای مدیر است.</p></div>`;
return `<h2 style="margin-top:24px">پنل مدیریت (آزمایشی)</h2><div class="g">${[['متخصصان نمونه',P.length],['پروژه‌ها',allPr().length],['پیشنهادها',S.props.length],['گزارش‌های باز',S.reports.filter(r=>r.st=='باز').length],['علاقه‌مندی‌ها',S.fav.length]].map(x=>`<div class="c"><div class="mu">${x[0]}</div><b style="font-size:26px">${fa(x[1])}</b></div>`).join('')}</div>
<section><h2>گزارش‌های تخلف</h2>${S.reports.map((r,i)=>`<div class="c row sp" style="margin:6px 0"><span>${r.t}</span><span>${r.st}${r.st=='باز'?` <button class="btn o s" data-rs="${i}">بررسی شد</button>`:''}</span></div>`).join('')}</section>
<section><h2>دسته‌بندی‌ها</h2><div class="ov"><table>${CATS.map(c=>`<tr><td>${c[0]}</td><td>${fa(c.length-1)} تخصص</td></tr>`).join('')}</table></div><p class="mu">ویرایش دسته‌بندی‌ها در این نمونه فقط‌خواندنی است.</p></section>`};
R['/terms']=()=>`<div class="c" style="margin-top:24px;max-width:720px"><h2>قوانین و حریم خصوصی</h2><p>این یک نمونه اولیه است. داده‌ها فقط در مرورگر شما ذخیره می‌شوند و جایی ارسال نمی‌شوند. اطلاعات حساس واقعی وارد نکنید.</p></div>`;
R['/404']=()=>`<div class="c" style="margin:40px auto;text-align:center;max-width:420px"><h1>۴۰۴</h1><p>صفحه‌ای که دنبالش بودید پیدا نشد.</p><a class="btn" href="#/">بازگشت به خانه</a></div>`;
// ---- router
function route(){const h=location.hash.slice(1)||'/';const [path,qs]=h.split('?');const q=new URLSearchParams(qs||'');let f,arg;
const m=path.match(/^(\/pro\/|\/project\/)(\d+)$/);if(m){f=R[m[1]];arg=m[2]}else{f=R[path];arg=q}
$('#app').innerHTML=(f||R['/404'])(arg);head();scrollTo(0,0);bind(path,q)}
function bind(path,q){
if(path=='/'){$('#qs').onsubmit=e=>{e.preventDefault();location.hash='#/search?t='+encodeURIComponent($('#q').value)}}
if(path=='/search'){$('#flt').onsubmit=e=>{e.preventDefault();const u=new URLSearchParams();new FormData(e.target).forEach((v,k)=>{if(v)u.set(k,v)});const n='#/search?'+u;if(location.hash==n)route();else location.hash=n};runSearch(q)}
if(path=='/login')loginBind();if(path=='/new')newBind();
if(path=='/profile'){$('#pf2').onsubmit=e=>{e.preventDefault();for(const k in S.prof){const el=$('#p_'+k);if(el)S.prof[k]=k=='photo'?(el.checked?1:0):el.value.trim()}if(S.prof.name)S.user.name=S.prof.name;save();toast('پروفایل ذخیره شد');route()};
$('#vr').onclick=()=>toast('درخواست تأیید ثبت شد (شبیه‌سازی)');document.querySelectorAll('[data-go]').forEach(a=>a.onclick=e=>{e.preventDefault();const el=$('#'+a.dataset.go);el.focus();el.scrollIntoView({block:'center'})})}
if(path=='/messages'){document.querySelectorAll('[data-ch]').forEach(a=>a.onclick=e=>{e.preventDefault();CH=+a.dataset.ch;S.chats[CH].unread=0;save();route()});
const mf=$('#mf');if(mf)mf.onsubmit=e=>{e.preventDefault();const t=$('#mt').value.trim();if(!t)return;const c=S.chats[CH];c.m.push(['me',t]);save();route();setTimeout(()=>{c.m.push(['o','پیام شما دریافت شد. (پاسخ خودکار نمایشی)']);save();if(location.hash=='#/messages')route()},900)};
const bl=$('[data-bl]');if(bl)bl.onclick=()=>{if(confirm('این کاربر مسدود شود؟')){S.chats.splice(CH,1);CH=0;save();route();toast('کاربر مسدود شد')}};
const rp=$('[data-rp]');if(rp)rp.onclick=()=>{S.reports.unshift({t:'گزارش گفت‌وگو با '+S.chats[CH].w,st:'باز'});save();toast('گزارش ثبت شد')}}
if(path=='/notifs'){$('#ra').onclick=()=>{S.nt.forEach(n=>n.r=1);save();route()};document.querySelectorAll('[data-rd]').forEach(b=>b.onclick=()=>{S.nt[b.dataset.rd].r=1;save();route()})}
if(path=='/favs'&&$('#cc'))$('#cc').onclick=()=>{S.cmp=[];save();route()};
if(path=='/admin')document.querySelectorAll('[data-rs]').forEach(b=>b.onclick=()=>{S.reports[b.dataset.rs].st='بررسی‌شده';save();route()});
const sp=$('#sp');if(sp)sp.onclick=()=>propForm(sp.dataset.id);
document.querySelectorAll('[data-ps]').forEach(s=>s.onchange=()=>{const x=S.props.find(p=>p.id==s.dataset.ps),st=s.value;
if(st=='پذیرفته‌شده'){const j=allPr().find(o=>o[0]==x.pid),n=j?j[4].find(r=>r[1]==x.role):0,acc=S.props.filter(p=>p.pid==x.pid&&p.role==x.role&&p.st=='پذیرفته‌شده'&&p.id!=x.id).length;if(n&&acc>=n[2]){toast('ظرفیت این نقش پر است');return route()}}
x.st=st;save();toast('وضعیت پیشنهاد تغییر کرد')});
document.querySelectorAll('[data-pw]').forEach(b=>b.onclick=()=>{const x=S.props.find(p=>p.id==b.dataset.pw);x.st='پس‌گرفته‌شده';save();route()})}
document.addEventListener('click',e=>{const f=e.target.closest('[data-fav]'),c=e.target.closest('[data-cmp]'),m=e.target.closest('[data-msg]');
if(f){if(!can())return toast('برای ذخیره، وارد شوید'),location.hash='#/login';const id=+f.dataset.fav,i=S.fav.indexOf(id);if(i<0)S.fav.push(id);else S.fav.splice(i,1);save();route()}
if(c){if(!can())return toast('برای مقایسه، وارد شوید');const id=+c.dataset.cmp;if(!S.cmp.includes(id)){if(S.cmp.length>=3)return toast('حداکثر ۳ مورد');S.cmp.push(id);save()}toast('به مقایسه اضافه شد')}
if(m){if(!can())return toast('برای ارسال پیام، وارد شوید'),location.hash='#/login';const p=P.find(x=>x[0]==m.dataset.msg);let i=S.chats.findIndex(x=>x.w==p[1]);if(i<0){S.chats.unshift({w:p[1],pj:'گفت‌وگوی مستقیم',m:[['o','سلام! چطور می‌توانم کمک کنم؟']],unread:0});i=0}CH=i;save();location.hash='#/messages'}});
function propForm(pid){const pf=$('#pf');if(!can()){toast('برای ارسال پیشنهاد، وارد شوید');return location.hash='#/login'}
pf.innerHTML=`<form class="c" id="f9" style="max-width:560px"><h2>پیشنهاد همکاری</h2><label for="q1">نقش</label><select id="q1">${allPr().find(j=>j[0]==pid)[4].map(r=>`<option>${r[1]}</option>`).join('')}</select><label for="q2">دستمزد پیشنهادی (تومان)</label><input id="q2" type="number" min="0"><div class="er" id="e1"></div><label for="q3">معرفی کوتاه</label><textarea id="q3"></textarea><div class="er" id="e2"></div><button class="btn" style="margin-top:12px">ارسال</button></form>`;pf.scrollIntoView();
$('#f9').onsubmit=e=>{e.preventDefault();$('#e1').textContent=$('#e2').textContent='';let ok=1;if(!$('#q2').value){$('#e1').textContent='دستمزد را وارد کنید';ok=0}if($('#q3').value.trim().length<10){$('#e2').textContent='معرفی حداقل ۱۰ نویسه باشد';ok=0}if(!ok)return;
S.props.unshift({id:Date.now(),pid:+pid,by:S.user.name,role:$('#q1').value,fee:+$('#q2').value,msg:$('#q3').value.trim(),st:'ارسال‌شده',mine:1});S.nt.unshift({t:'پیشنهاد شما ارسال شد',r:0});save();toast('پیشنهاد ارسال شد');route()}}
function newBind(){const d=NEWP,rd=()=>{const g=i=>$('#'+i);if(g('a1')){d.t=g('a1').value;d.ty=+g('a2').value;d.c=+g('a3').value;d.ds=g('a4').value}if(g('a5')){d.co=g('a5').value;d.f=+g('a6').value;d.du=g('a7').value}document.querySelectorAll('[data-r]').forEach(c=>{const[i,s]=c.dataset.r.split('|');d.r=d.r.filter(r=>r[1]!=s);if(c.checked)d.r.push([+i,s,1])})};
const er=m=>{$('#e1').textContent=m;return 0};
const nx=$('#nx');if(nx)nx.onclick=()=>{rd();if(d.s==0&&d.t.trim().length<3)return er('عنوان حداقل ۳ نویسه باشد');if(d.s==1&&!d.r.length)return er('حداقل یک تخصص انتخاب کنید');if(d.s==2&&d.f<0)return er('مبلغ معتبر نیست');d.s++;route()};
const pv=$('#pv');if(pv)pv.onclick=()=>{rd();d.s--;route()};
const fin=draft=>{S.pr.unshift([Date.now(),d.t,d.ty,d.c,d.r,d.co,d.f,d.ds||'بدون توضیح',draft?'draft':'pub']);save();NEWP={s:0,t:"",ty:0,c:0,ds:"",r:[],co:"پروژه‌ای",f:0,du:""};toast(draft?'پیش‌نویس ذخیره شد':'پروژه منتشر شد');location.hash=draft?'#/dash':'#/projects'};
if($('#pb'))$('#pb').onclick=()=>fin(0);if($('#dr'))$('#dr').onclick=()=>fin(1)}
function loginBind(){const e=m=>$('#e1').textContent=m;
if($('#l1'))$('#l1').onclick=()=>{const p=$('#ph').value.replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));if(!/^09\d{9}$/.test(p))return e('شماره موبایل معتبر نیست (مثلاً 09123456789)');LG={s:1,p};route()};
if($('#l2'))$('#l2').onclick=()=>{const c=$('#cd').value.replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));if(c!='12345')return e('کد اشتباه است. کد آزمایشی ۱۲۳۴۵ است.');if(LG.p=='09000000000'){S.user={name:'مدیر آزمایشی',roles:['admin'],admin:1};save();LG={s:0,p:''};toast('ورود مدیر آزمایشی');return location.hash='#/admin'}LG.s=2;route()};
if($('#l3'))$('#l3').onclick=()=>{const n=$('#nm').value.trim();if(n.length<2)return e('نام را وارد کنید');const r=[];if($('#r1').checked)r.push('client');if($('#r2').checked)r.push('pro');if(!r.length)return e('حداقل یک نقش انتخاب کنید');S.user={name:n,roles:r};S.prof.name=n;save();LG={s:0,p:''};location.hash='#/dash'}}
addEventListener('hashchange',route);theme();route();
</script>
</body>
</html>
